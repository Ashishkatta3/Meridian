<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian — a personal travel atlas</title>
<meta name="description" content="A personal travel atlas: every city, state and country, with the local time and weather where each one is.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#E9EAE4; --surface:#F3F4EF; --rule:#C8CCC2; --rule-soft:#D5D8CF;
  --ink:#14181A; --muted:#3F4745; --faint:#6E756F; --ghost:#868C85;
  --accent:#0E5A61; --accent-hover:#093E43; --warm:#8A5A10;
  --pin:#8A5A10; --pin-glow:rgba(138,90,16,.14);
  --btn-fg:#F3F4EF; --btn-bg:#0E5A61;
  --grain:rgba(0,0,0,.028); --grid:rgba(20,24,26,.06);
  --serif:'Instrument Serif','Iowan Old Style','Times New Roman',serif;
  --sans:'Space Grotesk','Helvetica Neue',Helvetica,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --maxw:1180px; --pad:40px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{
  --ground:#0B0F14; --surface:#141B23; --rule:#27313A; --rule-soft:#222B34;
  --ink:#E8ECEA; --muted:#9BA7A8; --faint:#8A969A; --ghost:#68757A;
  --accent:#58CED4; --accent-hover:#8FE2E6; --warm:#E8B055;
  --pin:#E8B055; --pin-glow:rgba(232,176,85,.16);
  --btn-fg:#14110A; --btn-bg:#E8B055;
  --grain:rgba(255,255,255,.04); --grid:rgba(155,167,168,.08);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--sans);background:var(--ground);color:var(--ink);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(var(--grain) 1px,transparent 1px);background-size:3px 3px;
  transition:background-color .45s ease,color .45s ease;
}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--warm);outline-offset:3px}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:400;letter-spacing:-.015em;text-wrap:pretty}
p{margin:0;text-wrap:pretty}
button{font-family:var(--sans)}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.mono{font-family:var(--mono)}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--muted)}
.lab-s{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted)}
.rule{height:1px;background:var(--rule);border:0;margin:0}

/* ---- top bar ---- */
.topbar{border-bottom:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--ground)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;letter-spacing:.3em;color:var(--ink);padding:16px 0}
.brand svg{stroke:var(--warm)}
.navlinks{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.navlinks a{color:var(--muted);font-size:14px;padding:14px 0}
.navlinks a:hover{color:var(--ink)}
.searchwrap{position:relative;padding:8px 0}
#search{font-family:var(--mono);font-size:12px;background:transparent;color:var(--ink);
  border:1px solid var(--rule);border-radius:999px;padding:0 14px;height:40px;width:210px;max-width:46vw}
#search::placeholder{color:var(--ghost)}
#results{position:absolute;right:0;top:52px;width:300px;max-width:84vw;background:var(--surface);
  border:1px solid var(--rule);border-radius:2px;overflow:hidden;z-index:60;box-shadow:0 18px 40px rgba(0,0,0,.18)}
#results a{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;color:var(--ink);
  font-size:14px;border-bottom:1px solid var(--rule-soft)}
#results a:last-child{border-bottom:0}
#results a:hover{background:var(--ground)}
#results .r-sub{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);white-space:nowrap}
.hidden{display:none !important}

/* ---- crumbs ---- */
.crumbs{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);padding-top:20px;line-height:2}
.crumbs .here{color:var(--ink)}

/* ---- hero ---- */
.hero{display:flex;flex-wrap:wrap;gap:56px;align-items:flex-end}
.hero-main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:24px}
.hero-side{flex:1 1 340px;min-width:0}
.title-xl{font-size:clamp(52px,8.6vw,104px);line-height:.94;letter-spacing:-.025em}
.title-l{font-size:clamp(38px,5.4vw,56px);line-height:1}
.h2{font-size:clamp(32px,4.2vw,46px);line-height:1.02}
.lede{max-width:52ch;font-size:17px;line-height:1.62;color:var(--muted)}

/* ---- readout strip ---- */
.readout{display:flex;flex-wrap:wrap;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.ro{display:flex;flex-direction:column;gap:8px;padding:20px 32px;border-right:1px solid var(--rule)}
.ro:first-child{padding-left:0}
.ro:last-child{border-right:0}
.ro-v{font-family:var(--mono);font-size:clamp(22px,3vw,30px);line-height:1}
.ro-sun{font-family:var(--mono);font-size:14px;line-height:1.55}
.sky{display:flex;align-items:center;gap:10px;color:var(--warm)}
.sky .ro-v{color:var(--ink)}

/* ---- chips & buttons ---- */
.chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;
  letter-spacing:.1em;border:1px solid var(--rule);border-radius:999px;padding:7px 12px;color:var(--muted)}
.chip.warm{color:var(--warm)}
.chip.on{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:600;border:0;border-radius:2px;
  background:var(--btn-bg);color:var(--btn-fg);padding:0 20px;min-height:46px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:500}
.btn:hover{filter:brightness(1.07)}
.toggle{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  color:var(--muted);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:0 14px;min-height:44px;cursor:pointer}
.sw{width:26px;height:15px;border-radius:999px;background:var(--rule);display:flex;align-items:center;padding:2px}
.sw i{width:11px;height:11px;border-radius:999px;background:var(--surface);display:block;transition:transform .25s ease}
html[data-theme="dark"] .sw{background:var(--warm)}
html[data-theme="dark"] .sw i{background:#14110A;transform:translateX(11px)}

/* ---- sections ---- */
.sec{padding-top:84px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:14px;
  padding-bottom:26px;border-bottom:1px solid var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:24px;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:36px 0}
.stat-n{font-family:var(--serif);font-size:clamp(40px,5vw,58px);line-height:1}

/* ---- entry rows ---- */
.row{display:flex;flex-wrap:wrap;gap:24px;padding:28px 0;border-bottom:1px solid var(--rule)}
.row-n{font-family:var(--mono);font-size:13px;color:var(--warm);width:30px;flex:0 0 auto;padding-top:8px}
.row-b{flex:999 1 400px;min-width:0;display:flex;flex-direction:column;gap:8px}
.row-t{font-family:var(--serif);font-size:clamp(24px,3vw,30px);line-height:1.1}
.row-d{font-size:15px;line-height:1.6;color:var(--muted)}
.row-note{font-size:15px;line-height:1.6;color:var(--faint);font-style:italic}
.row-tags{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;padding-top:6px}

/* ---- cards ---- */
.grid{display:grid;gap:20px}
.g-cities{grid-template-columns:repeat(auto-fit,minmax(min(262px,100%),1fr))}
.g-wide{grid-template-columns:repeat(auto-fit,minmax(min(310px,100%),1fr))}
.card{display:flex;flex-direction:column;justify-content:space-between;gap:20px;min-height:180px;
  background:var(--surface);border:1px solid var(--rule-soft);border-radius:2px;padding:22px;color:var(--ink);
  transition:border-color .2s ease,transform .2s ease}
.card:hover{border-color:var(--pin);transform:translateY(-2px);color:var(--ink)}
.card.empty{background:transparent;border:1px dashed var(--rule);justify-content:flex-end}
.card.empty:hover{transform:none;border-color:var(--rule)}
.card-t{font-family:var(--serif);font-size:30px;line-height:1.05}
.card.empty .card-t{color:var(--faint)}
.pin{width:10px;height:10px;border-radius:999px;background:var(--pin);box-shadow:0 0 0 5px var(--pin-glow);flex:0 0 auto}
.pin.off{background:transparent;border:1px solid var(--ghost);box-shadow:none}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ---- empty state ---- */
.blank{display:flex;flex-wrap:wrap;align-items:center;gap:30px;border:1px dashed var(--rule);
  border-radius:2px;padding:38px;margin-top:28px}
.blank-b{flex:999 1 340px;min-width:0;display:flex;flex-direction:column;gap:9px}

/* ---- map panel ---- */
.panel{border:1px solid var(--rule);border-radius:2px;background:var(--surface);overflow:hidden}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;
  padding:20px 24px;border-bottom:1px solid var(--rule-soft)}
.plot{position:relative;height:min(58vw,520px);min-height:300px;background:var(--ground);
  background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:64px 64px}
.plot-in{position:absolute;inset:42px 56px}
.dot{position:absolute;display:flex;align-items:center;gap:8px;transform:translate(-5px,-5px)}
.dot b{font-family:var(--mono);font-size:10px;letter-spacing:.1em;font-weight:400;color:var(--ink);white-space:nowrap}
.dot.off b{color:var(--ghost)}
.places{display:flex;flex-wrap:wrap}
.places-l{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--rule-soft)}
.places-l a,.places-l span{display:flex;align-items:center;gap:12px;padding:15px 24px;border-bottom:1px solid var(--rule-soft);font-size:15px;color:var(--ink)}
.places-l a:last-child,.places-l span:last-child{border-bottom:0}
.places-r{flex:999 1 400px;min-width:0;display:flex;align-items:center;justify-content:center;min-height:260px;
  background:var(--ground);background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:48px 48px;padding:24px;text-align:center}

/* ---- live board ---- */
.board{border:1px solid var(--rule);background:var(--surface);border-radius:2px}
.board-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.board-r{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;border-bottom:1px solid var(--rule);color:var(--ink)}
.board-r:last-child{border-bottom:0}
.board-r:hover{background:var(--ground)}
.board-city{display:flex;flex-direction:column;gap:3px}
.board-right{display:flex;align-items:center;gap:14px}
.board-t{font-family:var(--mono);font-size:16px;width:74px;text-align:right}
.live{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--accent)}
.live i{width:6px;height:6px;border-radius:999px;background:var(--accent);display:block;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ---- page nav + footer ---- */
.pagenav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;
  border-top:1px solid var(--rule);padding-top:24px;margin-top:64px}
.pagenav a{display:flex;flex-direction:column;gap:5px;padding:8px 0;color:var(--ink)}
.pagenav .nx{align-items:flex-end;text-align:right}
.pagenav .nt{font-family:var(--serif);font-size:24px}
footer{margin-top:72px;border-top:1px solid var(--rule);background:var(--surface)}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px;padding:34px 0}
.merid{display:flex;align-items:center;gap:14px;padding-top:30px}
.merid i{height:1px;background:var(--rule);flex:1 1 auto}
.merid b{width:7px;height:7px;border-radius:999px;background:var(--warm);display:block}
.note{font-size:13px;line-height:1.6;color:var(--faint);max-width:74ch}

@media (max-width:640px){
  :root{--pad:20px}
  .sec{padding-top:56px}
  .ro{padding:16px 20px}
  .readout{flex-direction:column}
  .ro{border-right:0;border-bottom:1px solid var(--rule);padding-left:0}
  .ro:last-child{border-bottom:0}
  .hero{gap:32px}
  .plot-in{inset:28px 34px}
  .dot b{display:none}
}

/* ---- been / want controls ---- */
:root{--on-accent:#F3F4EF;--accent-glow:rgba(14,90,97,.16)}
html[data-theme="dark"]{--on-accent:#06252A;--accent-glow:rgba(88,206,212,.20)}
.statusctl{display:inline-flex;align-items:stretch;border:1px solid var(--rule);border-radius:999px;
  overflow:hidden;background:var(--ground);position:relative;z-index:2;flex:0 0 auto}
.statusctl button{appearance:none;background:transparent;border:0;cursor:pointer;font-family:var(--mono);
  font-size:10px;letter-spacing:.12em;color:var(--muted);padding:0 12px;height:36px;display:inline-flex;
  align-items:center;gap:6px;white-space:nowrap;transition:background .18s ease,color .18s ease}
.statusctl button + button{border-left:1px solid var(--rule)}
.statusctl button:hover{color:var(--ink)}
.statusctl button.been[aria-pressed="true"]{background:var(--pin);color:var(--btn-fg)}
.statusctl button.want[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.statusctl svg{flex:0 0 auto}
.card{position:relative}
.card .go{position:static;color:inherit}
.card .go::after{content:"";position:absolute;inset:0;z-index:1}
.card:hover .card-t{color:var(--ink)}
.card-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.pin.want{background:var(--accent);box-shadow:0 0 0 5px var(--accent-glow)}
.dot .pin.want{background:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}
.card.wish{border-style:solid;border-color:var(--accent)}
.row-tags{align-items:center}
@media (max-width:640px){
  .statusctl button{padding:0 10px;font-size:9px}
  .row-tags{width:100%}
}

</style>
</head>

      ({title:t, lat, lon, desc:d, tag, id:'place:'+abbr+':'+slug(t), seed:been?'been':'none'}))};

/* ---------- been / want / nothing ---------- */
const STORE_KEY = 'meridian-status';
let STATUS = {};
try { STATUS = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(e) { STATUS = {}; }
const SEED = {};
ALL_CITIES.forEach(c=>{ if (c.seed !== 'none') SEED[c.id] = c.seed; });
ATLAS.forEach(s=>s.statewide.forEach(p=>{ if (p.seed !== 'none') SEED[p.id] = p.seed; }));
ALL_COUNTRIES.forEach(c=>{ if (c.seed !== 'none') SEED[c.id] = c.seed; });
CONTINENTS.forEach(c=>{ if (c.seed !== 'none') SEED[c.id] = c.seed; });

const statusOf = id => (id in STATUS) ? STATUS[id] : (SEED[id] || 'none');
const been = id => statusOf(id) === 'been';
const want = id => statusOf(id) === 'want';
function setStatus(id, v){
  if (v === 'none') STATUS[id] = 'none'; else STATUS[id] = v;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(STATUS)); } catch(e){}
}
function stateStatus(st){
  if (st.id in STATUS && STATUS[st.id] !== 'none') return STATUS[st.id];
  if (st.cities.some(c=>been(c.id)) || st.statewide.some(p=>been(p.id))) return 'been';
  if (st.cities.some(c=>want(c.id)) || st.statewide.some(p=>want(p.id))) return 'want';
  return statusOf(st.id);
}
function countryStatus(co){
  if (co.id in STATUS && STATUS[co.id] !== 'none') return STATUS[co.id];
  if (co.detailed){
    if (ATLAS.some(s=>stateStatus(s)==='been')) return 'been';
    if (ATLAS.some(s=>stateStatus(s)==='want')) return 'want';
  }
  return statusOf(co.id);
}
function continentStatus(ct){
  if (ct.id in STATUS && STATUS[ct.id] !== 'none') return STATUS[ct.id];
  const s = ct.countries.map(countryStatus);
  if (s.includes('been')) return 'been';
  if (s.includes('want')) return 'want';
  return statusOf(ct.id);
}
const counts = () => ({
  continents: CONTINENTS.filter(c=>continentStatus(c)==='been').length,
  countries: ALL_COUNTRIES.filter(c=>countryStatus(c)==='been').length,
  states: ATLAS.filter(s=>stateStatus(s)==='been').length,
  cities: ALL_CITIES.filter(c=>been(c.id)).length,
  places: ATLAS.reduce((n,s)=>n+s.statewide.filter(p=>been(p.id)).length,0),
  wish: ALL_CITIES.filter(c=>want(c.id)).length
        + ALL_COUNTRIES.filter(c=>want(c.id)).length
        + ATLAS.reduce((n,s)=>n+s.statewide.filter(p=>want(p.id)).length,0)
});

/* ---------- sun position: NOAA sunrise equation, no network needed ---------- */
const RAD = Math.PI/180, J2000 = 2451545.0;
function sunTimes(lat, lon, when){
  const J = when.getTime()/86400000 + 2440587.5, lw = -lon;
  const n = Math.round(J - J2000 - 0.0009 - lw/360);
  const Js = J2000 + 0.0009 + lw/360 + n;
  const M = (357.5291 + 0.98560028*(Js - J2000)) % 360;
  const C = 1.9148*Math.sin(M*RAD) + 0.02*Math.sin(2*M*RAD) + 0.0003*Math.sin(3*M*RAD);
  const lam = (M + C + 180 + 102.9372) % 360;
  const Jt = Js + 0.0053*Math.sin(M*RAD) - 0.0069*Math.sin(2*lam*RAD);
  const dec = Math.asin(Math.sin(lam*RAD)*Math.sin(23.4397*RAD));
  const cosH = (Math.sin(-0.833*RAD) - Math.sin(lat*RAD)*Math.sin(dec)) / (Math.cos(lat*RAD)*Math.cos(dec));
  if (cosH >= 1) return {polar:'night'};
  if (cosH <= -1) return {polar:'day'};
  const H = Math.acos(cosH)/RAD;
  const toDate = j => new Date((j - 2440587.5)*86400000);
  return {rise: toDate(Jt - H/360), set: toDate(Jt + H/360)};
}
function isNightAt(lat, lon, when){
  const t = sunTimes(lat, lon, when || new Date());
  if (t.polar) return t.polar === 'night';
  const now = (when||new Date()).getTime();
  return now < t.rise.getTime() || now > t.set.getTime();
}

const fmtZone = (d, tz) => { try { return new Intl.DateTimeFormat('en-US',{timeZoneName:'short',timeZone:tz})

const coord = (lat,lon)=> Math.abs(lat).toFixed(2)+'°'+(lat<0?'S':'N')+' '+Math.abs(lon).toFixed(2)+'°'+(lon<0?'W':'E');

};
const glyph = (k,size) => '<svg width="'+(size||19)+'" height="'+(size||19)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(G[k]||G.cloudy)+'</svg>';
function codeToSky(code, night){
  if (code === 0) return night ? ['night','CLEAR'] : ['clear','CLEAR'];
  if (code === 1 || code === 2) return ['partly','PARTLY CLOUDY'];
  if (code === 3) return ['cloudy','OVERCAST'];
  if (code === 45 || code === 48) return ['fog','FOG'];
  if (code >= 95) return ['storm','THUNDERSTORM'];
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ['snow','SNOW'];
  if (code >= 51) return ['rain','RAIN'];
  return ['cloudy','CLOUD'];
}

/* ---------- weather (open-meteo, no key, no account) ---------- */
const WX = {};
async function loadWeather(points){
  const need = points.filter(p=>!(p.key in WX));
  if (!need.length){ paintWeather(); return; }
  try{
    const url = 'https://api.open-meteo.com/v1/forecast?latitude='+need.map(p=>p.lat).join(',')
      +'&longitude='+need.map(p=>p.lon).join(',')
      +'&current=temperature_2m,weather_code&temperature_unit=fahrenheit';
    const r = await fetch(url);
    if (!r.ok) throw new Error('bad response');
    let j = await r.json();
    if (!Array.isArray(j)) j = [j];
    j.forEach((d,i)=>{ if (d && d.current) WX[need[i].key] = {t:Math.round(d.current.temperature_2m), c:d.current.weather_code}; });
    paintWeather();
  }catch(e){ /* offline, or blocked by the host's content policy — clocks still run */ }
}
function paintWeather(){
  document.querySelectorAll('[data-wx]').forEach(el=>{
    const w = WX[el.dataset.wx];
    if (!w) return;
    const night = el.dataset.night === '1', big = el.dataset.big === '1';
    const sky = codeToSky(w.c, night);
    el.innerHTML = glyph(sky[0], big?26:14) + '<span class="'+(big?'ro-v':'')+'">'+w.t+'°F</span>'
      + (big ? '<span class="lab-s" style="margin-left:4px">'+sky[1]+'</span>' : '');
  });
}

/* ---------- CSV export: imports straight into Google My Maps ---------- */
function csvOf(rows){
  const q = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  return ['Name,Location,Category,Status,Notes'].concat(rows.map(r=>r.map(q).join(','))).join('\r\n');
}
async function offerFile(filename, text){
  let dl = null;
  try { if (window.claude && claude.use) dl = await claude.use('downloads'); } catch(e){}
  if (dl){ try { await dl.save({filename, data:text}); } catch(e){} return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type:'text/csv'}));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
const mark = id => statusOf(id).toUpperCase();
function cityRows(c){
  const at = ', '+c.name+', '+c.state.name;
  const rows = [[c.name+' — city centre', c.name+', '+c.state.name, 'CITY', mark(c.id), '']];
  c.todo.forEach(t=>rows.push([t.title, t.title+at, t.tag, mark(t.id), t.desc]));
  c.eat.forEach(e=>rows.push([e.name, e.name+at, 'RESTAURANT', mark(e.id), e.note||'']));
  return rows;
}
function stateRows(st){
  const rows = [];
  st.statewide.forEach(p=>rows.push([p.title, p.title+', '+st.name, p.tag, mark(p.id), p.desc]));
  st.cities.filter(c=>statusOf(c.id)!=='none' || c.todo.length).forEach(c=>rows.push(...cityRows(c)));
  return rows;
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-dl]');
  if (!b) return;
  const bits = b.dataset.dl.split(':');
  if (bits[0] === 'city'){ const c = CITY_BY_KEY[bits[1]]; offerFile(c.slug+'-places.csv', csvOf(cityRows(c))); }
  else if (bits[0] === 'state'){ const s = BY_ABBR[bits[1]]; offerFile(s.slug+'-places.csv', csvOf(stateRows(s))); }
  else offerFile('meridian-all-places.csv', csvOf(ATLAS.flatMap(stateRows)));
});

function plot(points){
  const X = l => ((l+125)/58.5)*100, Y = l => ((49.4-l)/25)*100;
  const dots = points.filter(p=>p.lon>-126 && p.lon<-66 && p.lat>23.5 && p.lat<49.6).map(p=>
    '<span class="dot'+(p.s==='been'?'':' off')+'" style="left:'+X(p.lon).toFixed(2)+'%;top:'+Y(p.lat).toFixed(2)+'%" title="'+esc(p.label)+'">'
    + pinFor(p.s)+(p.show?'<b>'+esc(p.label).toUpperCase()+'</b>':'')+'</span>').join('');
  return '<div class="plot"><div class="plot-in">'+dots+'</div></div>';
}

  const wide = st.statewide.length ? rowsHTML(st.statewide)
    : blank('Nothing statewide yet','Parks, lakes, falls and regions that belong to no single city are listed here. Add them to STATEWIDE in the data file.');
  const rank = c => statusOf(c.id)==='been' ? 0 : statusOf(c.id)==='want' ? 1 : 2;
  const sorted = st.cities.slice().sort((a,b)=>rank(a)-rank(b));
  return crumbs([['World','#/'],[HOME_CONT.name, contHref(HOME_CONT)],[USA.name, countryHref(USA)],[st.name,'']])
  + '<div class="wrap"><div style="padding-top:40px;display:flex;flex-wrap:wrap;gap:40px;align-items:flex-end;justify-content:space-between">'
  + '<div style="flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:18px">'
  + '<h1 class="title-xl">'+esc(st.name)+'</h1>'+ctl(st.id, st.name)+'</div>'
  + '<div class="readout" style="flex:0 0 auto">'
  + '<span class="ro"><span class="ro-v">'+nb+'</span><span class="lab">CITIES LOGGED</span></span>'
  + '<span class="ro"><span class="ro-v">'+st.statewide.filter(p=>been(p.id)).length+'</span><span class="lab">ACROSS THE STATE</span></span>'
  + '<span class="ro"><span class="ro-v">'+(st.cities.length-nb)+'</span><span class="lab">PAGES WAITING</span></span>'
  + '</div></div>'
  + '<div class="sec">'+secHead('Across the state','PARKS, FALLS, LAKES AND REGIONS')+wide+'</div>'
  + '<div class="sec">'+secHead('Cities', nb+' OF '+st.cities.length+' LOGGED')
  + '<div class="grid g-cities" style="padding-top:28px">'+sorted.map(cityCard).join('')+'</div></div>'
  + '<div class="sec"><div class="panel"><div class="panel-head" style="border:0">'
  + '<span style="display:flex;flex-direction:column;gap:6px"><span class="card-t" style="font-size:26px">Every '+esc(st.name)+' pin, one file</span>'
  + '<span class="note">Bundles the statewide places and every city below them, with your been and want marks.</span></span>'
  + '<button class="btn" data-dl="state:'+st.slug+'">'+ICON.down+st.slug+'-places.csv</button></div></div></div>'
  + '</div>';
}

/* ---------- city ---------- */
function viewCity(c){
  const now = new Date();
  const sun = sunTimes(c.lat, c.lon, now);
  const night = isNightAt(c.lat, c.lon, now);
  routeIsNight = night;
  const sunLine = sun.polar ? (sun.polar === 'day' ? 'MIDNIGHT SUN' : 'POLAR NIGHT')
    : '↑ '+fmtTime(sun.rise,c.tz)+'<br>↓ '+fmtTime(sun.set,c.tz);
  const idx = c.state.cities.indexOf(c);
  const prev = c.state.cities[(idx-1+c.state.cities.length)%c.state.cities.length];
  const next = c.state.cities[(idx+1)%c.state.cities.length];
  const places = c.todo.length
    ? '<div class="places"><div class="places-l">'
      + c.todo.map(t=>'<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(t.title+', '+c.name+', '+c.state.name)+'" target="_blank" rel="noopener">'+pinFor(statusOf(t.id))+esc(t.title)+'</a>').join('')
      + '</div><div class="places-r"><span class="note">Each name opens in Google Maps. The CSV carries all of them, and your marks, in one import.</span></div></div>'
    : '';
  return crumbs([['World','#/'],[HOME_CONT.name, contHref(HOME_CONT)],[USA.name, countryHref(USA)],[c.state.name, stateHref(c.state)],[c.name,'']])
  + '<div class="wrap"><div style="padding-top:40px"><div class="hero">'
  + '<div class="hero-main">'
  + '<h1 class="title-xl">'+esc(c.name)+'</h1>'
  + '<span class="lab">'+esc(c.state.name).toUpperCase()+', UNITED STATES · '+coord(c.lat,c.lon)+'</span>'
  + '<div class="readout">'
  + '<span class="ro"><span class="lab">LOCAL TIME</span><span class="ro-v" data-tz="'+c.tz+'">'+fmtTime(now,c.tz)+'</span></span>'
  + '<span class="ro"><span class="lab">SKY</span><span class="sky" data-wx="'+c.key+'" data-night="'+(night?1:0)+'" data-big="1">'
  + glyph(night?'night':'clear',26)+'<span class="ro-v">—</span></span></span>'
  + '<span class="ro"><span class="lab">SUN</span><span class="ro-sun">'+sunLine+'</span></span></div>'
  + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px">'
  + ctl(c.id, c.name)
  + '<span class="chip warm">'+glyph(night?'night':'clear',14)+(night?'IT IS NIGHT IN ':'IT IS DAYTIME IN ')+esc(c.name).toUpperCase()+'</span></div>'
  + '<p class="note">The page follows this city\u2019s clock, not yours — override it with the control up top.</p>'
  + '</div>'
  + '<div class="hero-side"><div class="board"><div class="board-h"><span class="lab">SAVED PLACES</span>'
  + '<span class="lab-s">'+pad2(c.todo.length+c.eat.length)+'</span></div>'
  + '<div style="padding:18px"><p class="note" style="margin-bottom:14px">One CSV with every pin on this page, ready to import into Google My Maps.</p>'
  + '<button class="btn" data-dl="city:'+c.key+'">'+ICON.down+c.slug+'-places.csv</button></div></div></div>'
  + '</div></div>'
  + '<div class="sec">'+secHead('Things to do', pad2(c.todo.length)+' LISTED')
  + (c.todo.length ? rowsHTML(c.todo) : blank('Nothing logged here yet','Add entries for this city to TODO in the data file and they appear here, on the map and in the CSV.'))
  + '</div>'
  + '<div class="sec">'+secHead('Where I ate', pad2(c.eat.length)+' LOGGED')
  + (c.eat.length
    ? '<div class="grid g-wide" style="padding-top:28px">'+c.eat.map(e=>'<div class="card" style="justify-content:flex-start;gap:12px;min-height:0">'
      + '<span class="lab-s">'+esc(e.cuisine||'')+'</span><span class="card-t">'+esc(e.name)+'</span>'
      + '<p class="row-d">'+esc(e.note||'')+'</p><span class="card-foot">'+ctl(e.id, e.name)+'</span></div>').join('')+'</div>'
    : blank('No restaurants logged yet','Add them to EAT in the data file — name, cuisine and one line on whether it was worth it.'))
  + '</div>'
  + (places ? '<div class="sec">'+secHead('On the map','OPENS IN GOOGLE MAPS')+'<div class="panel" style="margin-top:28px">'+places+'</div></div>' : '')
  + '<div class="pagenav">'
  + '<a href="'+cityHref(prev)+'"><span class="lab-s">← PREVIOUS</span><span class="nt">'+esc(prev.name)+'</span></a>'
  + '<a class="lab" href="'+stateHref(c.state)+'" style="padding:8px 0">ALL OF '+esc(c.state.name).toUpperCase()+'</a>'
  + '<a class="nx" href="'+cityHref(next)+'"><span class="lab-s">NEXT →</span><span class="nt">'+esc(next.name)+'</span></a>'
  + '</div></div>';
}

function viewMissing(){
  routeIsNight = isNightAt(38,-97);
  return '<div class="wrap" style="padding-top:80px"><h1 class="title-l">No page at that address</h1>'
  + '<p class="lede" style="padding-top:16px">Try the search box, or <a href="#/">start again from the atlas</a>.</p></div>';
}

/* ===========================================================
   ROUTER
   =========================================================== */
function route(){
  const parts = location.hash.replace(/^#\/?/,'').split('#')[0].split('/').filter(Boolean);
  let html, points = [], title = 'Meridian', foot = 'A PERSONAL TRAVEL ATLAS';
  const ct = parts[0] ? CONT_BY_SLUG[parts[0]] : null;
  if (!parts.length){ html = viewHome(); points = BOARD.concat(FEATURED); }
  else if (!ct){ html = viewMissing(); }
  else if (parts.length === 1){ html = viewContinent(ct); title = ct.name+' — Meridian'; }
  else {
    const co = ct.countries.find(c=>c.slug === parts[1]);
    if (!co){ html = viewMissing(); }
    else if (parts.length === 2 || !co.detailed){ html = viewCountry(co); title = co.name+' — Meridian'; }
    else {
      const st = BY_ABBR[parts[2]];
      if (!st){ html = viewMissing(); }
      else if (parts.length === 3){
        html = viewState(st); title = st.name+' — Meridian'; foot = st.tz.toUpperCase().replace('_',' ');
        points = st.cities.map(c=>c.key);
      } else {
        const c = st.cities.find(x=>x.slug === parts[3]);
        if (!c){ html = viewMissing(); }
        else { html = viewCity(c); title = c.name+', '+st.abbr+' — Meridian'; foot = c.tz.toUpperCase().replace('_',' '); points = [c.key]; }
      }
    }
  }
  document.getElementById('app').innerHTML = html;
  document.title = title;
  document.getElementById('footnote').textContent = foot;
  applyTheme();
  tick();
  loadWeather(points.map(k=>CITY_BY_KEY[k]).filter(Boolean).map(c=>({key:c.key, lat:c.lat, lon:c.lon})));
}
function tick(){
  const now = new Date();
  document.querySelectorAll('[data-tz]').forEach(el=>{ el.textContent = fmtTime(now, el.dataset.tz); });
}
setInterval(tick, 1000);
window.addEventListener('hashchange', ()=>{ route(); if (!location.hash.includes('#map')) window.scrollTo(0,0); });

/* ===========================================================
   SEARCH
   =========================================================== */
const INDEX = [];
CONTINENTS.forEach(ct=>{
  INDEX.push({label:ct.name, sub:'CONTINENT', href:contHref(ct), rank:1});
  ct.countries.forEach(co=>INDEX.push({label:co.name, sub:'COUNTRY · '+ct.name.toUpperCase(), href:countryHref(co), rank:co.detailed?0:2}));
});
ATLAS.forEach(s=>{
  INDEX.push({label:s.name, sub:s.abbr+' · STATE', href:stateHref(s), rank:1});
  s.statewide.forEach(p=>INDEX.push({label:p.title, sub:s.abbr+' · '+p.tag, href:stateHref(s), rank:0}));
  s.cities.forEach(c=>INDEX.push({label:c.name, sub:s.abbr+' · CITY', href:cityHref(c), rank:1}));
});
const box = document.getElementById('search'), res = document.getElementById('results');
function runSearch(){
  const q = box.value.trim().toLowerCase();
  if (q.length < 2){ res.classList.add('hidden'); return; }
  const hits = INDEX.filter(e=>e.label.toLowerCase().includes(q))
    .sort((a,b)=> a.rank-b.rank || a.label.toLowerCase().indexOf(q)-b.label.toLowerCase().indexOf(q) || a.label.localeCompare(b.label))
    .slice(0,8);
  res.innerHTML = hits.length
    ? hits.map(h=>'<a href="'+h.href+'"><span>'+esc(h.label)+'</span><span class="r-sub">'+esc(h.sub)+'</span></a>').join('')
    : '<a href="#/"><span>Nothing by that name</span></a>';
  res.classList.remove('hidden');
}
box.addEventListener('input', runSearch);
box.addEventListener('focus', runSearch);
res.addEventListener('click', ()=>{ res.classList.add('hidden'); box.value=''; });
document.addEventListener('click', e=>{ if (!e.target.closest('.searchwrap')) res.classList.add('hidden'); });
box.addEventListener('keydown', e=>{ if (e.key === 'Escape'){ res.classList.add('hidden'); box.blur(); } });

route();

</script>
</body>
</html>
