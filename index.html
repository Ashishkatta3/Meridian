<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian — a personal travel atlas</title>
<meta name="description" content="A personal travel atlas: every city, state and country, with the local time and weather where each one is.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http%3A//www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230E5A61'/%3E%3Cg fill='none' stroke='%23E8B055' stroke-width='1.5'%3E%3Ccircle cx='12' cy='12' r='6.5'/%3E%3Cpath d='M12 5.5v13M5.8 9.6h12.4M5.8 14.4h12.4'/%3E%3C/g%3E%3C/svg%3E">
<!-- ?v= is a cache buster. Bump the number on every deploy, or a phone
     keeps an old copy of one file next to a new copy of another and the
     site half-loads: routes that exist with data that does not. -->
<link rel="stylesheet" href="assets/css/styles.css?v=3">
</head>
<body>
<div class="topbar" id="topbar"><div class="wrap topbar-in">
  <a class="brand" href="#/">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><path d="M4.2 7.5h15.6M4.2 16.5h15.6"/></svg>
    MERIDIAN
  </a>

  <!-- Three destinations that earn their own slot, then two groups. On a
       phone the whole nav collapses behind MENU and the groups become
       accordions instead of hover menus, because there is no hover. -->
  <nav class="nav" id="navmenu" aria-label="Main">
    <a href="#/continents" data-nav="continents">Atlas</a>
    <a href="#/events" data-nav="events">Calendar</a>
    <a href="#/bucket" data-nav="bucket">Bucket list</a>

    <span class="navgrp" data-grp="tools">
      <button type="button" class="grpbtn" aria-expanded="false" aria-controls="grp-tools">Tools
        <svg class="caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
      </button>
      <span class="grpmenu" id="grp-tools">
        <a href="#/plan" data-nav="plan">Plan a trip<em>Place, days, budget</em></a>
        <a href="#/translate" data-nav="translate">Translate<em>Type or speak, 60 languages</em></a>
      </span>
    </span>

    <span class="navgrp" data-grp="you">
      <button type="button" class="grpbtn" aria-expanded="false" aria-controls="grp-you">You
        <svg class="caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
      </button>
      <span class="grpmenu" id="grp-you">
        <a href="#/been" data-nav="been">Been there<em>Everywhere you have marked</em></a>
        <a href="#/want" data-nav="want">Want to go<em>The list the atlas watches</em></a>
        <a href="#/trips" data-nav="trips">Trips<em>Journeys, not lists</em></a>
        <a href="#/board" data-nav="board">The board<em>A badge for each one</em></a>
        <a href="#/account" data-nav="account">Account<em>Sign in and sync</em></a>
      </span>
    </span>
  </nav>

  <span class="searchwrap">
    <label for="search" class="hidden">Search places</label>
    <input id="search" type="search" placeholder="FIND A PLACE" autocomplete="off">
    <span id="results" class="hidden"></span>
  </span>

  <button class="toggle" id="themebtn" type="button" aria-label="Switch between light and dark">
    <span class="sw"><i></i></span><span id="themelab">AUTO</span>
  </button>

  <button class="menubtn" id="menubtn" type="button" aria-expanded="false" aria-controls="navmenu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg>
    <span class="menulab">MENU</span>
  </button>
</div></div>
<main id="app"></main>
<footer><div class="wrap">
  <div class="merid"><i></i><b></b><i></i></div>
  <div class="foot">
    <a class="mono" href="#/" style="font-size:12px;letter-spacing:.3em;color:var(--ink)">MERIDIAN</a>
    <span class="lab-s" id="footnote">A PERSONAL TRAVEL ATLAS</span>
  </div>
</div></footer>
<script src="assets/js/config.js?v=3"></script>
<script src="assets/js/world.js?v=3"></script>
<script src="assets/js/visa.js?v=3"></script>
<script src="assets/js/profile.js?v=3"></script>
<script src="assets/js/climate.js?v=3"></script>
<script src="assets/js/local.js?v=3"></script>
<script src="assets/js/land.js?v=3"></script>
<script src="assets/js/data.js?v=3"></script>
<script src="assets/js/parks.js?v=3"></script>
<script src="assets/js/cities.js?v=3"></script>
<script src="assets/js/events.js?v=3"></script>
<script src="assets/js/bucket.js?v=3"></script>

<script src="assets/js/cloud.js?v=3"></script>
<script src="assets/js/features.js?v=3"></script>
<script src="assets/js/translate.js?v=3"></script>
<script src="assets/js/plan.js?v=3"></script>
<script src="assets/js/views.js?v=3"></script>
<script src="assets/js/app.js?v=3"></script>
</body>
</html>
